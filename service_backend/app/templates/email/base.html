<!doctype html>
<html>
  <body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Inter,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background-color:#FF5A00;padding:20px 32px;">
                <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.5px;">Foundryx EMS</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #eeeeee;">
                <p style="margin:0;color:#999999;font-size:12px;line-height:18px;">
                  You received this email because of an account on Foundryx EMS.
                  If this wasn&rsquo;t you, you can safely ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
