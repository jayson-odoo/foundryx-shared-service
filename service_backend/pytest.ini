[pytest]
testpaths = tests
markers =
    live: hits a REAL LLM provider over the network. Deselected by default -
        run explicitly with `pytest -m live` and a provider key in .env.
        A normal run needs no key, costs nothing and never touches the network.
# `live` tests are opt-in: a bare `pytest` run must stay offline, free and
# deterministic (AC-BI-13). `-m live` overrides this on the command line.
# xdist (`-n auto --dist loadfile`) is NOT baked into addopts: a bare
# single-file/single-test run must stay serial and cheap on this shared
# machine (no worker-pool spin-up cost for a 3s run). Opt into parallelism
# explicitly for a full-suite run: `pytest -n auto --dist loadfile`. `--dist
# loadfile` keeps every test in one file on the same worker process - it
# protects the shared-registry patterns in conftest.py (module-global
# registries like ERRORED_MODULES, the webchat preflight session factory,
# `httpx.Client.send` monkeypatches) but does NOT protect process-global
# state that leaks ACROSS files sharing one worker (e.g. a hardcoded
# `settings.<field> = None` restore instead of `monkeypatch.setattr`) -
# that class of bug only reproduces with `-n 0 <file_a> <file_b>` in the
# suspected leaking order, never by auditing `loadfile` alone.
addopts = -m "not live"
