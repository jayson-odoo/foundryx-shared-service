[pytest]
testpaths = tests
markers =
    live: hits a REAL LLM provider over the network. Deselected by default -
        run explicitly with `pytest -m live` and a provider key in .env.
        A normal run needs no key, costs nothing and never touches the network.
# `live` tests are opt-in: a bare `pytest` run must stay offline, free and
# deterministic (AC-BI-13). `-m live` overrides this on the command line.
# `-n auto --dist loadfile` (suite-speed PR, 2026-09): parallel workers, one
# per CPU, each worker owns whole FILES (never splits a file across workers) -
# safest given the shared-registry patterns in conftest.py (module-global
# registries like ERRORED_MODULES, the webchat preflight session factory,
# `httpx.Client.send` monkeypatches) - a file's tests always share one
# process/thread the way they did before xdist. Debug a flaky/ordering-
# sensitive failure with `-n 0` (serial, no xdist).
addopts = -m "not live" -n auto --dist loadfile
