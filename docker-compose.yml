# Foundryx EMS - blue/green production compose.
#
# Active color tracked in .active_color (managed by scripts/blue_green_deploy.sh).
# IMAGE_TAG = git SHA pushed by CI; the deploy script exports it before pull/up.
# Public ports are owned by the HOST nginx; every container binds 127.0.0.1 only.
#
# Infra (db/redis/pgbackups) + the Celery workers/beat are NOT blue/green -
# they are recreated in place each deploy. Only the API + frontend swap colors.
#
# Secrets (JWT_SECRET, FERNET_KEY, OMNICHANNEL_FERNET_KEY, POSTGRES_PASSWORD,
# NEXTAUTH_SECRET, META_*, SMTP_*) come from a server-side .env file at the repo
# root - see .env.example. No secret carries an inline default here.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-foundryx}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-foundryx_service}
  POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER:-foundryx}:${POSTGRES_PASSWORD:?set in .env}@db:5432/postgres
  REDIS_URL: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"          # prod runs the real workers below
  JWT_SECRET: ${JWT_SECRET:?set in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  FERNET_KEY: ${FERNET_KEY:?set in .env}
  OMNICHANNEL_FERNET_KEY: ${OMNICHANNEL_FERNET_KEY:?set in .env}
  API_HOST: 0.0.0.0
  API_PORT: 8001
  WORKERS: ${BACKEND_WORKERS:-4}
  ENVIRONMENT: production
  DEBUG: "false"
  # Behind Caddy (sets X-Forwarded-*). Real client IP for the auth throttle +
  # correct scheme/host for generated links & secure cookies.
  TRUST_PROXY_HEADERS: "true"
  FORWARDED_ALLOW_IPS: "*"
  FRONTEND_URL: ${FRONTEND_URL:?set in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
  # External backend base INCLUDING the /be path prefix - backend self-built
  # absolute URLs (avatars, branding assets/theme, media, share links) use it.
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in .env}
  # Meta WhatsApp (omnichannel) - empty = simulated/dev-safe
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_ES_CONFIG_ID: ${META_ES_CONFIG_ID:-}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v19.0}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  # Platform-default SMTP (seeded into the platform tenant connection)
  PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
  PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
  PLATFORM_SMTP_SECURITY: ${PLATFORM_SMTP_SECURITY:-starttls}
  PLATFORM_SMTP_USERNAME: ${PLATFORM_SMTP_USERNAME:-}
  PLATFORM_SMTP_PASSWORD: ${PLATFORM_SMTP_PASSWORD:-}
  PLATFORM_SMTP_FROM_EMAIL: ${PLATFORM_SMTP_FROM_EMAIL:-}
  PLATFORM_SMTP_FROM_NAME: ${PLATFORM_SMTP_FROM_NAME:-Foundryx EMS}
  # External Code runner (workflow ``code.run`` action, sprint-4/19 S4). The
  # runner lives on the internal-only network and holds NONE of these vars.
  CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://code_runner:8011}
  CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}

x-backend-base: &backend-base
  image: ${IMAGE_REPO:-jayson1004/foundryx-shared-service}:backend-${IMAGE_TAG:-latest}
  build:
    context: ./service_backend
    dockerfile: Dockerfile
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped
  # NOTE: the `backend` network alias is added ONLY on the API colors below, not
  # here - otherwise the workers/beat would also answer to `backend:8001` and the
  # frontend's BACKEND_API_URL could resolve to a process with no HTTP server.
  networks:
    - foundryx_ss_network

services:
  # ---------------- Infra (NOT blue/green) ----------------
  db:
    image: postgres:16
    container_name: foundryx_ss_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-foundryx_service}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c log_min_duration_statement=500
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foundryx_ss_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundryx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - foundryx_ss_network

  redis:
    image: redis:7-alpine
    container_name: foundryx_ss_redis
    command: redis-server --appendonly yes
    volumes:
      - foundryx_ss_redis:/data
    restart: unless-stopped
    networks:
      - foundryx_ss_network

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: foundryx_ss_pgbackups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-foundryx_service}
      POSTGRES_USER: ${POSTGRES_USER:-foundryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - foundryx_ss_network

  # ---------------- Celery (NOT blue/green; recreated in place) ----------------
  # Two distinct Celery apps share the backend image:
  #   workflow_engine.worker → workflow tasks + beat schedule (run_due / prune)
  #   omnichannel.worker     → inbound WhatsApp message processing
  # ONE beat instance owns the workflow cron ticks.
  worker_workflow:
    <<: *backend-base
    container_name: foundryx_ss_worker_workflow
    environment: *backend-env
    command: ["celery", "-A", "app.workflow_engine.worker", "worker", "-Q", "workflow", "--loglevel", "info"]
    healthcheck:
      disable: true
    networks:
      - foundryx_ss_network
      - foundryx_ss_runner

  # ---------------- Code runner (sandboxed builder Python) ----------------
  # A separate, stdlib-only image (service_backend/code_runner/Dockerfile).
  # Hardened by deployment, not just by code: non-root, read-only rootfs,
  # no capabilities, no privilege escalation, memory/pids caps, and ONLY the
  # internal runner network (internal: true => no egress). It receives no
  # database URL, Redis URL, Fernet key, or provider credential. The seccomp
  # profile (deploy/code-runner-seccomp.json, synced by the deploy workflow)
  # denies connect() - the runner only ever ACCEPTS, so even a jail escape
  # cannot dial a peer on the internal network.
  code_runner:
    image: ${IMAGE_REPO:-jayson1004/foundryx-shared-service}:code-runner-${IMAGE_TAG:-latest}
    build:
      context: ./service_backend/code_runner
      dockerfile: Dockerfile
    container_name: foundryx_ss_code_runner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/code-runner-seccomp.json
    mem_limit: 512m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-m", "code_runner.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
      CODE_RUNNER_CONCURRENCY: ${CODE_RUNNER_CONCURRENCY:-4}
      CODE_RUNNER_WALL_SECONDS: ${CODE_RUNNER_WALL_SECONDS:-5}
      CODE_RUNNER_CPU_SECONDS: ${CODE_RUNNER_CPU_SECONDS:-3}
      CODE_RUNNER_MEMORY_BYTES: ${CODE_RUNNER_MEMORY_BYTES:-134217728}
    networks:
      - foundryx_ss_runner

  worker_omni:
    <<: *backend-base
    container_name: foundryx_ss_worker_omni
    environment: *backend-env
    command: ["celery", "-A", "modules.omnichannel.worker", "worker", "-Q", "omni", "--loglevel", "info"]
    healthcheck:
      disable: true

  beat:
    <<: *backend-base
    container_name: foundryx_ss_beat
    environment: *backend-env
    command: ["celery", "-A", "app.workflow_engine.worker", "beat", "--loglevel", "info"]
    healthcheck:
      disable: true

  # ---------------- Backend API blue/green ----------------
  backend_blue:
    <<: *backend-base
    container_name: foundryx_ss_backend_blue
    profiles: ["blue"]
    environment: *backend-env
    networks:
      foundryx_ss_network:
        aliases:
          - backend
      foundryx_ss_runner: {}
    ports:
      - "127.0.0.1:8200:8001"

  backend_green:
    <<: *backend-base
    container_name: foundryx_ss_backend_green
    profiles: ["green"]
    environment: *backend-env
    networks:
      foundryx_ss_network:
        aliases:
          - backend
      foundryx_ss_runner: {}
    ports:
      - "127.0.0.1:8210:8001"

  # ---------------- Frontend blue/green ----------------
  frontend_blue:
    image: ${IMAGE_REPO:-jayson1004/foundryx-shared-service}:frontend-${IMAGE_TAG:-latest}
    build:
      context: ./service_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:?set in .env}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_ES_CONFIG_ID: ${NEXT_PUBLIC_META_ES_CONFIG_ID:-}
        NEXT_PUBLIC_META_GRAPH_VERSION: ${NEXT_PUBLIC_META_GRAPH_VERSION:-v19.0}
    container_name: foundryx_ss_frontend_blue
    profiles: ["blue"]
    environment: &frontend-env
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Server-side (NextAuth authorize() + branding SSR) - internal cluster URL.
      BACKEND_API_URL: http://backend:8001
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
    restart: unless-stopped
    networks:
      - foundryx_ss_network
    ports:
      - "127.0.0.1:3200:3001"

  frontend_green:
    image: ${IMAGE_REPO:-jayson1004/foundryx-shared-service}:frontend-${IMAGE_TAG:-latest}
    build:
      context: ./service_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL:?set in .env}
        NEXT_PUBLIC_META_APP_ID: ${NEXT_PUBLIC_META_APP_ID:-}
        NEXT_PUBLIC_META_ES_CONFIG_ID: ${NEXT_PUBLIC_META_ES_CONFIG_ID:-}
        NEXT_PUBLIC_META_GRAPH_VERSION: ${NEXT_PUBLIC_META_GRAPH_VERSION:-v19.0}
    container_name: foundryx_ss_frontend_green
    profiles: ["green"]
    environment: *frontend-env
    restart: unless-stopped
    networks:
      - foundryx_ss_network
    ports:
      - "127.0.0.1:3210:3001"

volumes:
  foundryx_ss_pg:
    driver: local
  foundryx_ss_redis:
    driver: local

networks:
  # Internal-only (no egress): the Code runner + whoever must call it.
  foundryx_ss_runner:
    internal: true
  foundryx_ss_network:
    driver: bridge
